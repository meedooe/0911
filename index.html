<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>극블리 소서 스피드런 타이머 — D2R</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--
  ★ 경량 모델 주의 ★
  이 파일은 "마크업 뼈대"만 담는다. 내용 채우기는 js/04-render.js 가 한다.
  data-* 속성과 id 는 렌더러/이벤트 바인딩이 참조하므로 임의로 바꾸지 마라.

  2026-09-24: 이 페이지는 스피드런 랩타임 도구로 범위를 줄였다.
  맵 티어 평가 / 현상수배 보드 / 치트시트 / 막힘 가이드 / 도박 안내는
  guide.html(공략서, 캐릭터별로 실제 갱신되는 문서)로 이전됐다 — 아래 링크로 이동.
-->

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">❄</span>
    <div>
      <h1>극블리 소서 스피드런 타이머</h1>
      <p class="sub">Blizzard Sorceress · Lap Timer · 데이터 기준일 <span id="data-date"></span></p>
    </div>
  </div>
  <div class="topbar-actions">
    <a class="btn" href="guide.html">공략서 보기 →</a>
    <button type="button" class="btn btn-ghost" id="btn-reset">전체 초기화</button>
  </div>
</header>

<main class="wrap">

  <!-- ============ 스피드런 랩타임 & 세션 카운터 ============ -->
  <section class="panel visible" id="panel-timer">
    <div class="panel-head">
      <h2>스피드런 랩타임 &amp; 세션 카운터</h2>
      <div class="zone-select-wrap">
        <label for="timer-zone">측정 대상</label>
        <select id="timer-zone"></select>
      </div>
    </div>
    <p class="hint">지역 목록·티어·파밍 우선순위는 <a href="guide.html#zones">공략서의 지역 티어</a>를 참고해라. 여기서는 런타임만 잰다.</p>

    <div class="timer-display">
      <div class="timer-now" id="timer-now">0:00.0</div>
      <div class="timer-target" id="timer-target"></div>
    </div>

    <div class="timer-controls">
      <button type="button" class="btn btn-primary" id="btn-lap">런 시작</button>
      <button type="button" class="btn" id="btn-stop">중단</button>
      <button type="button" class="btn btn-ghost" id="btn-clear-runs">기록 삭제</button>
    </div>

    <div class="stat-cards" id="timer-stats"></div>
    <div class="lap-list" id="timer-laps"></div>
  </section>

  <!-- [TODO: LITE_MODEL_INSERT_FEATURE_HERE — 새 탭 패널(section.panel)을 여기 추가] -->

</main>

<footer class="foot">
  <p>로컬 전용 도구 · 외부 통신 없음 · 기록은 이 브라우저에만 저장된다</p>
  <p id="storage-note"></p>
</footer>

<!-- 로드 순서 고정: state -> data -> logic -> render -> main. 순서를 바꾸면 깨진다. -->
<script src="js/01-state.js"></script>
<script src="js/02-data.js"></script>
<script src="js/03-logic.js"></script>
<script src="js/04-render.js"></script>
<script src="js/05-main.js"></script>
</body>
</html>
